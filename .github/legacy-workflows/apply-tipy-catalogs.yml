name: Apply FilmovéNovinky tip catalogs patch

on:
  push:
    branches:
      - main
    paths:
      - "scripts/apply-tipy-catalogs.js"
      - ".github/workflows/apply-tipy-catalogs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Reset to latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Apply tip movie and series patch
        run: node scripts/apply-tipy-catalogs.js

      - name: Verify syntax and markers
        run: |
          node --check src/scrape.js
          node --check src/catalog.js
          node --check server.js
          grep -q "filmovenovinky-tipy-serialy" src/scrape.js
          grep -q "filmovenovinky-tipy-serialy" src/catalog.js
          grep -q "filmovenovinky-tipy-serialy" server.js
          grep -q "types: \['movie', 'series'\]" server.js

      - name: Commit source changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add src/scrape.js src/catalog.js server.js package.json
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "Add series to FilmovéNovinky tips catalog"
          git pull --rebase --autostash origin main
          git push origin main
