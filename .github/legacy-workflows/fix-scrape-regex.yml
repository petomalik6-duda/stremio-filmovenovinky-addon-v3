name: Fix scrape regex

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-scrape-regex.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Reset to latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Fix malformed tip rating parser
        run: |
          python3 - <<'PY'
          from pathlib import Path
          file = Path("src/scrape.js")
          src = file.read_text(encoding="utf-8")
          start = src.index("function parseNumber(value) {")
          end = src.index("function collectFollowingTipInfo", start)
          replacement = r"""function parseNumber(value) {
  if (!value || /^n\/?a$/i.test(String(value).trim())) return null;
  const n = Number(String(value).replace(',', '.'));
  return Number.isFinite(n) ? n : null;
}

function parseTipRatings(text) {
  const t = clean(text);
  const imdbMatch = t.match(/IMDb\s*(N\/?A|[0-9]+(?:[,.][0-9]+)?)\s*\/\s*10/i);
  const csfdMatch = t.match(/ČSFD\s*([0-9]{1,3})\s*%/i);
  const availabilityMatch = t.match(/\b(CZ\/SK|SK\/CZ|CZ|SK|Tit|Titulky)\b/i);
  const availability = availabilityMatch?.[1] || null;
  const lang = availability
    ? availability.toUpperCase().replace('SK/CZ', 'CZ/SK').replace('TITULKY', 'TIT').replace('TIT', 'TIT')
    : 'CZ/SK';
  const isSeries = /\bTV\s*seri[aá]l\b/i.test(t);
  const genre = clean(t
    .replace(/\bTV\s*seri[aá]l\b/ig, '')
    .replace(/IMDb[\s\S]*$/i, '')
    .replace(/ČSFD[\s\S]*$/i, '')
  ) || null;

  return {
    imdbRating: parseNumber(imdbMatch?.[1]),
    csfdPercent: parseNumber(csfdMatch?.[1]),
    lang,
    genre,
    availability,
    isSeries
  };
}

"""
          file.write_text(src[:start] + replacement + src[end:], encoding="utf-8")
          PY

      - name: Commit regex fix
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add src/scrape.js
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "Fix malformed tip rating parser regexes"
          git pull --rebase --autostash origin main
          git push origin main
