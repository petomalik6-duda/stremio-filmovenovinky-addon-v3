name: Apply FilmovéNovinky tip catalogs patch

on:
  push:
    branches:
      - main
    paths:
      - "scripts/apply-tipy-catalogs.js"
      - ".github/workflows/apply-tipy-catalogs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Reset to latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Patch tip catalog separation and poster fallback
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          catalog = Path('src/catalog.js')
          src = catalog.read_text(encoding='utf-8')
          src = re.sub(r"const BEST_IMDB_MIN = Number\(process\.env\.BEST_IMDB_MIN \|\| [0-9.]+\);", "const BEST_IMDB_MIN = Number(process.env.BEST_IMDB_MIN || 7.2);", src)
          src = re.sub(r"const BEST_CSFD_MIN = Number\(process\.env\.BEST_CSFD_MIN \|\| [0-9.]+\);", "const BEST_CSFD_MIN = Number(process.env.BEST_CSFD_MIN || 78);", src)

          if 'function sortBestTipsByRating' not in src:
            block_re = re.compile(r"function isBestRatedTip\(meta\) \{[\s\S]*?\n\}\n\nfunction sortByDateThenRating\(a, b\) \{[\s\S]*?\n\}\n\nexport function filterCatalog")
            replacement = """function tipImdb(meta) {
  return numeric(meta?._addon?.tipImdbRating);
}

function tipCsfd(meta) {
  return numeric(meta?._addon?.tipCsfdPercent);
}

function tipScore(meta) {
  const csfd = tipCsfd(meta) ? tipCsfd(meta) / 10 : 0;
  const imdb = tipImdb(meta);
  return Math.max(csfd, imdb);
}

function isBestRatedTip(meta) {
  const imdb = tipImdb(meta);
  const csfd = tipCsfd(meta);

  // Najlepšie hodnotené má byť menší a odlišný výber zo sekcie Tipy.
  // Preto používame iba ratingy načítané zo stránky FilmovéNovinky, nie TMDB fallback.
  return imdb >= BEST_IMDB_MIN || csfd >= BEST_CSFD_MIN;
}

function sortTipsByDate(a, b) {
  const byDate = String(b._addon?.dateAdded || '').localeCompare(String(a._addon?.dateAdded || ''));
  if (byDate) return byDate;
  return String(a.name || '').localeCompare(String(b.name || ''), 'sk');
}

function sortBestTipsByRating(a, b) {
  const byScore = tipScore(b) - tipScore(a);
  if (byScore) return byScore;

  const byCsfd = tipCsfd(b) - tipCsfd(a);
  if (byCsfd) return byCsfd;

  const byImdb = tipImdb(b) - tipImdb(a);
  if (byImdb) return byImdb;

  return sortTipsByDate(a, b);
}

export function filterCatalog"""
            src, count = block_re.subn(replacement, src)
            if count != 1:
              raise SystemExit(f'catalog sort block replacement count={count}')

          src = src.replace("  return arr.sort(sortByDateThenRating);\n}", "  const sortFn = id === 'filmovenovinky-najlepsie' ? sortBestTipsByRating : sortTipsByDate;\n  return arr.sort(sortFn);\n}")
          catalog.write_text(src, encoding='utf-8')

          public = Path('src/public-meta.js')
          pub = public.read_text(encoding='utf-8')
          if 'function placeholderPoster(name)' not in pub:
            pub = pub.replace(
              "function asString(value) {\n",
              "function placeholderPoster(name) {\n  return `https://placehold.co/500x750/222222/ffffff.png?text=${encodeURIComponent(String(name || 'CZ/SK').slice(0, 35))}`;\n}\n\nfunction asString(value) {\n"
            )
          marker = "  // First strip internal/non-standard cache fields and normalize strict types.\n  const safeMeta = cleanKnownMetaFields(meta);\n"
          insertion = """  // First strip internal/non-standard cache fields and normalize strict types.
  const safeMeta = cleanKnownMetaFields(meta);

  // Serve-time fallback so older cache entries and newly added tip items never
  // render as blank cards in Stremio/Nuvio/Fusion.
  const displayName = safeMeta.name || meta.name || 'CZ/SK';
  if (!safeMeta.poster) safeMeta.poster = placeholderPoster(displayName);
  if (!safeMeta.posterShape) safeMeta.posterShape = 'poster';
  if (!safeMeta.background) safeMeta.background = safeMeta.poster;
"""
          if 'Serve-time fallback so older cache entries' not in pub:
            if marker not in pub:
              raise SystemExit('public-meta insert marker not found')
            pub = pub.replace(marker, insertion)
          public.write_text(pub, encoding='utf-8')

          package = Path('package.json')
          pkg = json.loads(package.read_text(encoding='utf-8'))
          pkg['version'] = '3.7.14'
          package.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Verify syntax
        run: |
          node --check src/catalog.js
          node --check src/public-meta.js

      - name: Commit source changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add src/catalog.js src/public-meta.js package.json
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "Separate tip catalogs and add poster fallback"
          git pull --rebase --autostash origin main
          git push origin main
